<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<meta name="description" content="All official QEVZOR links in one place. Explore our store and follow us on social media.">
<title>QEVZOR — Connect with us</title>
<style>
:root{
  --bg:#080a11; --panel:#111521; --panel2:#151b2a; --text:#f5f7ff;
  --muted:#9ba5bb; --violet:#6558e8; --blue:#3d78e8; --cyan:#22c7d3;
  --line:rgba(255,255,255,.09); --glow:rgba(65,190,220,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(87,65,190,.20),transparent 42%),
    radial-gradient(ellipse at 90% 65%,rgba(16,169,190,.09),transparent 34%),
    var(--bg);
  display:flex; justify-content:center; padding:34px 18px 26px;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;
  background-image:linear-gradient(120deg,transparent 48%,rgba(255,255,255,.025) 49%,transparent 51%);
  background-size:8px 8px;mask-image:linear-gradient(to bottom,black,transparent 85%);
}
.wrap{width:min(100%,520px);position:relative;z-index:1}
.topline{display:flex;align-items:center;justify-content:space-between;margin:0 2px 22px}
.brand-mini{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.22em;color:#dce5ff}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.status{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9eabc3;border:1px solid var(--line);padding:7px 10px;border-radius:30px}
.hero{text-align:center;padding:8px 0 25px}
.logo-frame{
  width:min(100%,330px);margin:0 auto 5px;overflow:hidden;border-radius:20px;
  background:#0a0d15;box-shadow:0 18px 60px rgba(0,0,0,.38),0 0 35px rgba(66,113,229,.10);
  border:1px solid rgba(255,255,255,.07);
}
.logo-frame img{display:block;width:100%;height:auto}
h1{margin:16px 0 7px;font-size:clamp(28px,7vw,38px);letter-spacing:.18em;font-weight:850}
.tagline{margin:0;color:var(--muted);font-size:14px;letter-spacing:.025em}
.accent-line{width:64px;height:3px;border-radius:5px;margin:20px auto 0;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 18px var(--glow)}
.section-label{display:flex;align-items:center;gap:12px;margin:9px 2px 13px;color:#aab5ca;font-size:10px;font-weight:750;letter-spacing:.2em;text-transform:uppercase}
.section-label:after{content:"";height:1px;flex:1;background:var(--line)}
.links{display:grid;gap:12px}
.link-card{
  display:flex;align-items:center;gap:15px;min-height:76px;padding:13px 16px;
  border:1px solid var(--line);border-radius:17px;text-decoration:none;color:var(--text);
  background:linear-gradient(115deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  box-shadow:0 8px 25px rgba(0,0,0,.13);transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease;
  position:relative;overflow:hidden;
}
.link-card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(var(--violet),var(--cyan));opacity:.0;transition:opacity .2s}
.link-card:hover{transform:translateY(-3px);border-color:rgba(83,192,220,.42);background:linear-gradient(115deg,rgba(75,105,205,.15),rgba(23,183,195,.07));box-shadow:0 13px 34px rgba(0,0,0,.25),0 0 22px rgba(36,182,207,.08)}
.link-card:hover:before{opacity:1}
.icon-box{width:45px;height:45px;flex:0 0 45px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.07)}
.icon-box svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shop .icon-box{color:#67d6d5}.instagram .icon-box{color:#e8a2d5}.facebook .icon-box{color:#7ca8ff}.tiktok .icon-box{color:#e8faff}
.link-copy{flex:1;min-width:0}
.link-title{display:block;font-weight:750;font-size:15px;letter-spacing:.01em}
.link-sub{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.arrow{color:#8491aa;font-size:20px;transition:transform .2s,color .2s}
.link-card:hover .arrow{transform:translateX(3px);color:var(--cyan)}
.footer{text-align:center;padding:25px 0 3px;color:#758099;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.footer strong{color:#aab8d4;font-weight:750}
@media(max-width:380px){body{padding:22px 13px}.logo-frame{width:min(100%,290px)}.link-card{min-height:70px;padding:11px 12px}.icon-box{width:42px;height:42px;flex-basis:42px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
